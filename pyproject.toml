[project]
name = "sandpile-utac"
version = "1.0.0"
description = "BTW/Manna sandpile SOC as UTAC continuous phase transition — GenesisAeon Package 22"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Johann Römer", email = "contact@mor-research.org" }]
requires-python = ">=3.10"
keywords = ["sandpile", "SOC", "UTAC", "CREP", "phase-transition", "criticality", "genesis-aeon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
diamond      = "diamond_setup.cli:app"
sandpile-utac = "sandpile_utac.cli:app"

[project.urls]
Homepage      = "https://github.com/GenesisAeon/sandpile-utac"
Repository    = "https://github.com/GenesisAeon/sandpile-utac"
Documentation = "https://genesisaeon.github.io/sandpile-utac"
Issues        = "https://github.com/GenesisAeon/sandpile-utac/issues"
Zenodo        = "https://doi.org/10.5281/zenodo.19645351"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diamond_setup", "src/sandpile_utac"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=diamond_setup --cov=sandpile_utac --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
